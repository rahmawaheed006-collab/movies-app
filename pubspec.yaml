name: movies_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management (Required: Bloc only, no Provider)
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Firebase (Auth + Favourites)
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3

  # Networking (YTS API)
  dio: ^5.4.3+1

  # UI / Responsive helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Local cache (history / favourites offline)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/